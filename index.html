<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>烽火地带 · 改枪码图鉴</title>
<meta name="theme-color" content="#080a0c"/>
<style>
:root {
  --bg: #080a0c; --fg: #e8eee9; --card: #151a1e; --muted: #8b9690;
  --primary: #3ee0b0; --primary-fg: #06241a; --secondary: #1c2328;
  --border: #2a3330; --steel: #9aa7a0; --warn: #c4a574; --accent: #1e2a27;
}
* { box-sizing: border-box; border-color: var(--border); }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing: antialiased; }
button, [role=button] { cursor: pointer; font: inherit; }
button:disabled { cursor: default; }
a { color: var(--primary); }
.hero { position: relative; overflow: hidden; }
.hero img { width: 100%; height: min(72vh, 700px); min-height: 280px; object-fit: cover; object-position: center 42%; display: block; }
.hero-mask { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg), color-mix(in srgb, var(--bg) 35%, transparent) 55%, transparent); pointer-events: none; }
.hero-copy { position: absolute; left: 0; right: 0; bottom: 0; max-width: 72rem; margin: 0 auto; padding: 4rem 1.25rem 2rem; }
.kicker { margin: 0; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--primary); font-weight: 600; }
h1 { margin: .75rem 0 0; font-size: clamp(2.4rem, 8vw, 4.4rem); line-height: .95; font-weight: 600; }
h1 span { display: block; margin-top: .5rem; font-size: clamp(1.1rem, 3vw, 1.65rem); color: var(--steel); font-weight: 500; }
.lead { max-width: 36rem; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-top: 1rem; }
.btn { display: inline-flex; align-items: center; gap: .4rem; height: 44px; padding: 0 1.2rem; border-radius: 10px; border: 1px solid transparent; text-decoration: none; font-weight: 600; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-ghost { background: var(--secondary); color: var(--fg); border-color: var(--border); font-weight: 500; }
.wrap { max-width: 72rem; margin: 0 auto; padding: 2rem 1.25rem; }
.sticky { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.search { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--secondary); color: var(--fg); padding: 0 1rem; }
.chips { display: flex; gap: .5rem; overflow-x: auto; padding: .75rem 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--secondary); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1200px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
.card { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 16px; background: var(--card); overflow: hidden; }
.thumb { position: relative; aspect-ratio: 16/9; background: radial-gradient(ellipse at 50% 42%, #3a4148, #12161a 70%); border: 0; padding: 0; }
.thumb img { position: relative; z-index: 1; width: 88%; height: 100%; object-fit: contain; margin: 0 auto; display: block; }
.body { padding: .9rem 1rem 1rem; display: flex; flex-direction: column; flex: 1; }
.body h2 { margin: 0; font-size: 1.1rem; }
.meta { font-size: 12px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--secondary); color: var(--muted); }
.badge.teal { color: var(--primary); background: var(--accent); border-color: color-mix(in srgb, var(--primary) 25%, transparent); }
.badge.secret { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.actions { display: flex; gap: .5rem; margin-top: auto; padding-top: .75rem; }
.actions .btn { height: 32px; padding: 0 .9rem; font-size: 13px; flex: 1; }
.actions .btn-ghost { flex: 0 0 auto; }
code.block { display: block; font-family: ui-monospace, monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .7rem .8rem; color: var(--steel); word-break: break-all; overflow-x: auto; }
.dlg { border: 1px solid var(--border); border-radius: 16px; background: var(--card); color: var(--fg); padding: 0; width: min(100% - 1.5rem, 42rem); max-height: 92vh; overflow: auto; }
.dlg::backdrop { background: color-mix(in srgb, var(--bg) 80%, transparent); }
.dlg-img { height: 180px; background: radial-gradient(ellipse at 50% 42%, #3a4148, #12161a 70%); }
.dlg-img img { width: 80%; height: 100%; object-fit: contain; margin: 0 auto; display: block; }
.dlg-body { padding: 1rem 1.2rem 1.4rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.stats div { padding: .6rem .75rem; background: var(--bg); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.stats span { display: block; font-size: 12px; color: var(--muted); }
.build { border-top: 1px solid var(--border); padding: 1rem 0; }
.toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); padding: .6rem 1rem; border-radius: 10px; z-index: 40; display: none; }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.star { width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 18px; }
.star.on { color: var(--primary); }
.empty { text-align: center; padding: 4rem 1rem; border: 1px dashed var(--border); border-radius: 16px; }
</style>
</head>
<body>
<section class="hero">
  <img src="squad.jpg" alt="三角洲行动小队合影，摄于 HAAVK 航天基地" width="1672" height="941"/>
  <div class="hero-mask"></div>
  <div class="hero-copy">
    <p class="kicker">Delta Force / Operations</p>
    <h1>烽火地带<span>武器配装图鉴</span></h1>
    <p class="lead" id="hero-lead">进局前查码、复制、收藏。支持搜索、复制与本机收藏。</p>
    <div class="row">
      <a class="btn btn-primary" href="#armory">进入图鉴</a>
    </div>
  </div>
</section>

<section id="armory">
  <div class="wrap" style="padding-bottom:.75rem">
    <p class="kicker">Armory</p>
    <h2 style="margin:.35rem 0 0;font-size:1.75rem">改枪码图鉴</h2>
    <p class="lead">机密 30万内 · 中档 30–50万 · 绝密 50万+。贵不代表更好用。代码需游戏内导入确认。</p>
  </div>
  <div class="sticky">
    <div class="wrap" style="padding:.75rem 1.25rem">
      <input class="search" id="q" placeholder="搜枪名、改枪码、腰射、倍镜…" aria-label="搜索"/>
    </div>
  </div>
  <div class="wrap" style="padding-top:.75rem;padding-bottom:0">
    <div class="chips" id="cats"></div>
    <div class="chips" id="tiers"></div>
  </div>
  <div class="wrap">
    <p class="meta" id="count"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p>没有匹配方案</p>
      <button class="btn btn-ghost" type="button" id="reset">重置筛选</button>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>收藏保存在当前浏览器中 · 改枪码请在游戏内导入确认。</p>
    <p>电脑用 Chrome / Edge 双击「打开图鉴.html」。手机用夸克、Chrome 或 Safari 打开该文件。</p>
  </div>
</footer>

<dialog class="dlg" id="dlg"></dialog>
<div class="toast" id="toast">已复制</div>

const CAT_SHORT = {"突击／战斗步枪":"突击步枪","冲锋枪":"冲锋枪","射手步枪":"射手步枪","狙击步枪":"狙击步枪","机枪":"机枪","霰弹枪":"霰弹枪","手枪":"手枪","特殊武器":"特殊"};
const TIERS = [{id:"机密",hint:"30万内"},{id:"中档",hint:"30–50万"},{id:"绝密",hint:"50万+"},{id:"待判断",hint:"价格未知"}];
const TONE = {机密:"teal",中档:"",绝密:"secret",待判断:""};

const state = { q:"", category:"", tier:"", favOnly:false, fav: new Set(JSON.parse(localStorage.getItem("fh-off-fav")||"[]")) };
function saveFav(){ localStorage.setItem("fh-off-fav", JSON.stringify([...state.fav])); }

function rel(p){ return (p||"").replace(/^\//,""); }
function norm(s){ return String(s||"").toUpperCase().replace(/[\s\-_/·]/g,""); }
function featured(builds){
  const priced = builds.filter(b => b.cost != null).sort((a,b)=>a.cost-b.cost);
  return priced[0] || builds[0];
}
function priceLabel(builds){
  const nums = builds.map(b=>b.cost).filter(n => n != null);
  if (!nums.length) return "价格待判断";
  const lo = Math.min(...nums), hi = Math.max(...nums);
  return lo===hi ? lo+"万" : lo+"–"+hi+"万";
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=> el.style.display="none", 1600);
}
async function copyText(v){
  try { await navigator.clipboard.writeText(v); return true; }
  catch {
    const t = document.createElement("textarea"); t.value=v; document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove(); return ok;
  }
}

function filtered(){
  const term = norm(state.q.trim());
  const out = [];
  for (const g of GUNS) {
    if (state.favOnly && !state.fav.has(g.id)) continue;
    if (state.category && g.category !== state.category) continue;
    const shown = g.builds.filter(b => !state.tier || b.tier === state.tier);
    if (!shown.length) continue;
    if (term) {
      const blob = norm([g.name, ...(g.aliases||[]), g.category, ...shown.flatMap(b=>[b.tag,b.code,b.price])].join(" "));
      if (!blob.includes(term)) continue;
    }
    out.push({...g, shown});
  }
  const catI = Object.fromEntries(CATS.map((c,i)=>[c,i]));
  out.sort((a,b)=> (catI[a.category]??99)-(catI[b.category]??99));
  return out;
}

function chip(label, on, click){
  const b = document.createElement("button");
  b.type="button"; b.className="chip"; b.setAttribute("aria-pressed", on?"true":"false");
  b.textContent = label; b.onclick = click; return b;
}

function renderChips(){
  const cats = document.getElementById("cats"); cats.replaceChildren();
  cats.append(chip("全部枪种", !state.category, ()=>{ state.category=""; render(); }));
  CATS.forEach(c => cats.append(chip(CAT_SHORT[c]||c, state.category===c, ()=>{ state.category = state.category===c?"":c; render(); })));
  const tiers = document.getElementById("tiers"); tiers.replaceChildren();
  TIERS.forEach(t => tiers.append(chip(t.id+" "+t.hint, state.tier===t.id, ()=>{ state.tier = state.tier===t.id?"":t.id; render(); })));
  tiers.append(chip("收藏 "+(state.fav.size||""), state.favOnly, ()=>{ state.favOnly=!state.favOnly; render(); }));
}

function renderGrid(){
  const list = filtered();
  const n = list.reduce((s,g)=>s+g.shown.length,0);
  document.getElementById("count").textContent = "显示 "+list.length+" 种武器 · "+n+" 套匹配方案";
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.replaceChildren();
  empty.hidden = list.length>0;
  list.forEach((g,i) => {
    const f = featured(g.shown);
    const art = document.createElement("article"); art.className="card";
    art.innerHTML = `
      <button class="thumb" type="button" data-open="${g.id}" aria-label="查看 ${g.name} 配装">
        ${g.image?`<img src="${rel(g.image)}" alt="" loading="${i<6?"eager":"lazy"}"/>`:""}
      </button>
      <div class="body">
        <div style="display:flex;justify-content:space-between;gap:.5rem">
          <div>
            <p class="meta">${CAT_SHORT[g.category]||g.category} · ${g.shown.length} 套</p>
            <h2>${g.name}</h2>
          </div>
          <button class="star ${state.fav.has(g.id)?"on":""}" type="button" data-fav="${g.id}" aria-label="收藏">${state.fav.has(g.id)?"★":"☆"}</button>
        </div>
        <div style="margin-top:.4rem;display:flex;gap:.35rem;flex-wrap:wrap">
          ${g.rating?`<span class="badge secret">${g.rating.label} · ${g.rating.season}</span>`:""}
          <span class="badge">${priceLabel(g.shown)}</span>
        </div>
        <p style="margin:.7rem 0 0">${f.tag}</p>
        <p class="meta">参考价 ${f.price}</p>
        <div class="actions">
          <button class="btn btn-primary" type="button" data-copy="${encodeURIComponent(f.code)}" data-gun="${g.name}">复制这套</button>
          <button class="btn btn-ghost" type="button" data-open="${g.id}">${g.shown.length>1?"其余 "+(g.shown.length-1)+" 套":"详情"}</button>
        </div>
      </div>`;
    grid.append(art);
  });
}

function openGun(id){
  const g = GUNS.find(x=>x.id===id); if(!g) return;
  const dlg = document.getElementById("dlg");
  const rows = (filtered().find(x=>x.id===id)||{shown:g.builds}).shown;
  dlg.innerHTML = `
    <div class="dlg-img">${g.image?`<img src="${rel(g.image)}" alt="${g.name}"/>`:""}</div>
    <div class="dlg-body">
      <p class="meta">${CAT_SHORT[g.category]||g.category}</p>
      <h2 style="margin:.2rem 0">${g.name}</h2>
      <p class="meta">${rows.length} 套匹配方案 · 代码需游戏内导入确认</p>
      <div class="stats" style="margin:1rem 0 .5rem">
        <div><span>基础伤害</span><strong>${g.base?.damage ?? "待核实"}</strong></div>
        <div><span>护甲伤害</span><strong>${g.base?.armor ?? "待核实"}</strong></div>
        <div><span>射速</span><strong>${g.base?.rpm ?? "—"}</strong></div>
        <div><span>射程 · 米</span><strong>${g.base?.range ?? "—"}</strong></div>
        <div><span>操控速度</span><strong>${g.base?.handling ?? "待核实"}</strong></div>
        <div><span>后坐控制</span><strong>${g.base?.recoil ?? "待核实"}</strong></div>
      </div>
      ${g.rating?`<p class="badge secret">${g.rating.label} · ${g.rating.season}</p><p class="meta">${g.rating.condition}</p>`:`<p class="meta">武器梯度：待核实</p>`}
      ${rows.map(b=>`
        <div class="build">
          <span class="badge ${TONE[b.tier]||""}">${b.tier}</span>
          <h3 style="margin:.4rem 0 0;font-size:15px">${b.tag}</h3>
          <p class="meta">参考价 ${b.price}${b.date?" · "+b.date:""}</p>
          <code class="block">${b.code}</code>
          <button class="btn btn-primary" style="margin-top:.6rem;height:32px;font-size:13px" type="button" data-copy="${encodeURIComponent(b.code)}" data-gun="${g.name}">复制改枪码</button>
        </div>`).join("")}
      <form method="dialog" style="margin-top:1rem"><button class="btn btn-ghost" type="submit">关闭</button></form>
    </div>`;
  dlg.showModal();
}

document.getElementById("hero-lead").textContent =
  GUNS.length+" 种武器 · "+GUNS.reduce((n,g)=>n+g.builds.length,0)+" 套社区改枪码。支持搜索、复制与本机收藏。";

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("reset").onclick = () => { state.q=""; state.category=""; state.tier=""; state.favOnly=false; document.getElementById("q").value=""; render(); };
document.body.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-open],[data-copy],[data-fav]");
  if (!t) return;
  if (t.dataset.fav) { const id=t.dataset.fav; if(state.fav.has(id)) state.fav.delete(id); else state.fav.add(id); saveFav(); render(); return; }
  if (t.dataset.copy) { const ok = await copyText(decodeURIComponent(t.dataset.copy)); toast(ok?("已复制 "+(t.dataset.gun||"")):"复制失败，请长按代码"); return; }
  if (t.dataset.open) openGun(t.dataset.open);
});

function render(){ renderChips(); renderGrid(); }
render();
</script>
</body>
</html>
